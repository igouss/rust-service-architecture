name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: cargo install --locked --git https://github.com/igouss/hex-lint --rev c8a0000ad5f881378f99df86c60e461acb545c14
      - run: cargo install --locked --git https://github.com/igouss/effect-audit --rev 5ac249be7cb9bf5d36fd6ecf45e6927840db67c1
      - run: cargo install --locked --git https://github.com/igouss/req --rev 7ccd79b74ee037ca6aac6ac566fa0805fab262bb
      - run: just check

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: store
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STORE_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=store dbname=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just postgres

  mutation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: store
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STORE_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=store dbname=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-mutants
      - run: cargo install --locked --git https://github.com/igouss/hex-lint --rev c8a0000ad5f881378f99df86c60e461acb545c14
      - run: cargo install --locked --git https://github.com/igouss/effect-audit --rev 5ac249be7cb9bf5d36fd6ecf45e6927840db67c1
      - run: just mutants-core | tee mutants-core.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: mutants-core.txt
