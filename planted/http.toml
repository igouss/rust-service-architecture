[[mutant]]
name = "H1 a refusal is answered as accepted"
path = "adapter-http/src/lib.rs"
anchor = "(StatusCode::CONFLICT, refusal_name(refusal)).into_response()"
replacement = "(StatusCode::NO_CONTENT, refusal_name(refusal)).into_response()"
example = true
expect = "test"

[[mutant]]
name = "H2 a task id is not minted per request"
path = "adapter-http/src/lib.rs"
anchor = "StreamId::new(Uuid::now_v7().to_string())"
replacement = "StreamId::new(Uuid::nil().to_string())"
example = true
expect = "test"

[[mutant]]
name = "H10 a creation ignores its idempotency key"
path = "adapter-http/src/lib.rs"
anchor = """
.map(|key: Uuid| StreamId::new(key.to_string()))
            .ok_or(BadInput::MalformedKey),"""
replacement = """
.map(|_key: Uuid| StreamId::new(Uuid::now_v7().to_string()))
            .ok_or(BadInput::MalformedKey),"""
example = true
expect = "test"

[[mutant]]
name = "H11 a key that is not a UUID is replaced by a minted id"
path = "adapter-http/src/lib.rs"
anchor = ".ok_or(BadInput::MalformedKey),"
replacement = ".map_or_else(|| Ok(StreamId::new(Uuid::now_v7().to_string())), Ok),"
example = true
expect = "test"

