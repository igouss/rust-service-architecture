[package]
name = "adapter-postgres"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[package.metadata.hex-arch]
role = "driven-adapter"
context = "example"

[features]
server = []

[dependencies]
ports = { path = "../ports" }
postgres = "0.19"

[dev-dependencies]
domain = { path = "../domain" }
postgres = "0.19"
serde = { workspace = true }

[[test]]
name = "conformance"
required-features = ["server"]

[[test]]
name = "writers"
required-features = ["server"]

[lints]
workspace = true
