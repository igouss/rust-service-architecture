[package]
name = "adapter-postgres"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[package.metadata.hex-arch]
role = "driven-adapter"
context = "example"

[features]
server = []

[dependencies]
ports = { path = "../ports" }
postgres = "0.19"
r2d2 = "0.8"

[dev-dependencies]
app = { path = "../app" }
domain = { path = "../domain" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde = { workspace = true }

[[test]]
name = "conformance"
required-features = ["server"]

[[test]]
name = "writers"
required-features = ["server"]

[[test]]
name = "runtime"
required-features = ["server"]

[lints]
workspace = true
